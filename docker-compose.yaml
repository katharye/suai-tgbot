services:
  db:
    image: postgres:16
    container_name: suai_bot_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: suai_user
      POSTGRES_PASSWORD: suai_password
      POSTGRES_DB: suai_bot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: